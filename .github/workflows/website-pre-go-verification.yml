name: Website Pre-GO Verification

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/website-pre-go-verification-trigger.txt"

permissions:
  contents: write

concurrency:
  group: website-pre-go-verification-205
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exact dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Install ffprobe
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Legal production lock
        id: legal
        continue-on-error: true
        working-directory: website
        run: npm run legal:check
      - name: Content and privacy boundary
        id: content
        continue-on-error: true
        working-directory: website
        run: npm run content:check
      - name: ESLint
        id: lint
        continue-on-error: true
        working-directory: website
        run: npm run lint
      - name: Standalone Next.js build
        id: build
        continue-on-error: true
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Local media contract
        id: media
        continue-on-error: true
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/media -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          test "$(find public/media -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          test -f public/og-amthero24.png
          for file in public/media/*.mp4; do
            codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file")"
            size="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")"
            test "$codec" = "h264"
            test "$size" = "1280x720"
            python - "$duration" <<'PY'
import sys
value = float(sys.argv[1])
assert 14.95 <= value <= 15.05, value
PY
          done
      - name: Strict GO must remain blocked
        id: go_lock
        continue-on-error: true
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          if npm run go:check; then
            echo "GO check unexpectedly passed." >&2
            exit 1
          fi
          echo "GO check is correctly blocked."
      - name: Record sanitized verification status
        if: always()
        shell: bash
        env:
          LEGAL: ${{ steps.legal.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          GO_LOCK: ${{ steps.go_lock.outcome }}
        run: |
          set -euo pipefail
          cat > website/.pre-go-verification.json <<JSON
          {
            "baseline_main": "555b69c13d1af136090a4a210b0e75a55b57caf9",
            "website_branch": "feat/pre-go-launch-package-205",
            "legal_lock": "$LEGAL",
            "content_privacy": "$CONTENT",
            "lint": "$LINT",
            "build": "$BUILD",
            "local_media": "$MEDIA",
            "strict_go_blocked": "$GO_LOCK",
            "admission_enabled": false,
            "wave_one_capacity": 5
          }
          JSON
          git add website/.pre-go-verification.json
          git diff --cached --check
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test: record sanitized pre-go website verification"
            git push origin HEAD:feat/pre-go-launch-package-205
          fi
      - name: Enforce verification
        if: always()
        shell: bash
        env:
          LEGAL: ${{ steps.legal.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          GO_LOCK: ${{ steps.go_lock.outcome }}
        run: |
          set -euo pipefail
          test "$LEGAL" = "success"
          test "$CONTENT" = "success"
          test "$LINT" = "success"
          test "$BUILD" = "success"
          test "$MEDIA" = "success"
          test "$GO_LOCK" = "success"
