name: Backup Freshness Safety

on:
  pull_request:
    paths:
      - backup_freshness.py
      - backup_freshness_policy.py
      - backup_freshness_extensions.py
      - database_migrations.py
      - runtime_health.py
      - scripts/postgres_backup.py
      - tests/test_backup_freshness.py
      - tests/test_postgresql_backup_freshness.py
      - tests/test_database_migrations.py
      - tests/test_postgresql_schema_migrations.py
      - tests/test_postgresql_recovery_drill.py
      - .github/workflows/backup-freshness-safety.yml
      - .env.example
  push:
    branches: [main]
    paths:
      - backup_freshness.py
      - backup_freshness_policy.py
      - backup_freshness_extensions.py
      - database_migrations.py
      - runtime_health.py
      - scripts/postgres_backup.py
      - tests/test_backup_freshness.py
      - tests/test_postgresql_backup_freshness.py
      - tests/test_database_migrations.py
      - tests/test_postgresql_schema_migrations.py
      - tests/test_postgresql_recovery_drill.py
      - .github/workflows/backup-freshness-safety.yml
      - .env.example
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-freshness-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amthero24_backup_freshness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amthero24_backup_freshness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amthero24_backup_freshness
      DATABASE_FALLBACK_ALLOWED: "false"
      DB_POOL_MAX: "4"
      SCHEMA_MIGRATION_LOCK_TIMEOUT_SECONDS: "5"
      WEBHOOK_SIGNATURE_REQUIRED: "true"
      DURABLE_QUEUE_ENABLED: "true"
      REMINDER_WORKER_ENABLED: "false"
      PRIVACY_RETENTION_ENABLED: "true"
      PROVIDER_TELEMETRY_ENABLED: "true"
      ABUSE_GUARD_ENABLED: "true"
      ABUSE_GUARD_ENFORCEMENT_ENABLED: "true"
      ENTITLEMENT_ENFORCEMENT_ENABLED: "false"
      BACKUP_FRESHNESS_ENFORCEMENT_ENABLED: "false"
      BACKUP_WARNING_AFTER_HOURS: "30"
      BACKUP_BLOCK_AFTER_HOURS: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Generate isolated runtime credentials
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          names = (
              "GROQ_API_KEY",
              "WHATSAPP_TOKEN",
              "PHONE_NUMBER_ID",
              "VERIFY_TOKEN",
              "META_APP_SECRET",
              "ADMIN_API_TOKEN",
              "MESSAGE_QUEUE_ENCRYPTION_KEY",
              "REMINDER_ENCRYPTION_KEY",
              "SUPPORT_API_TOKEN",
              "SUPPORT_ENCRYPTION_KEY",
          )
          for name in names:
              print(f"{name}={secrets.token_urlsafe(48)}")
          PY
      - name: Compile backup freshness modules
        run: python -m py_compile backup_freshness.py backup_freshness_policy.py backup_freshness_extensions.py database_migrations.py runtime_health.py scripts/postgres_backup.py
      - name: Run policy and real PostgreSQL tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=short --junitxml=backup-freshness-junit.xml \
            tests/test_backup_freshness.py \
            tests/test_postgresql_backup_freshness.py \
            tests/test_database_migrations.py \
            tests/test_postgresql_schema_migrations.py 2>&1 | tee backup-freshness-test.log
      - name: Upload sanitized backup freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-freshness-safety
          path: |
            backup-freshness-junit.xml
            backup-freshness-test.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce backup freshness safety
        if: steps.tests.outcome == 'failure'
        run: exit 1
