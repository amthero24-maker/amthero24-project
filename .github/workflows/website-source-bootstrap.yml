name: Website Lock and Media Materialization

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/workflows/website-source-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: website-lock-media-205
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Pin dependency graph
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Generate six local demo videos
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          cd website
          python3 scripts/generate-demo-assets.py
          test "$(find public/media -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          for file in public/media/*.mp4; do
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file")" = "h264"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$file")" = "1280x720"
          done
      - name: Validate website before committing generated assets
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          npm run legal:check
          npm run content:check
          npm run lint
          npm run build
      - name: Commit lockfile and local media
        shell: bash
        run: |
          set -euo pipefail
          git add website/package-lock.json website/public/media
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Pinned lockfile and media are already current."
            exit 0
          fi
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "build: pin website dependencies and demo media"
          git push origin HEAD:feat/pre-go-launch-package-205
