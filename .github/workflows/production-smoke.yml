name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      require_launch_ready:
        description: Fail unless the protected launch report is fully ready
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ vars.PRODUCTION_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run read-only production checks
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SMOKE_REQUIRE_SIGNATURE: "true"
          SMOKE_REQUIRE_LAUNCH_READY: ${{ inputs.require_launch_ready || 'false' }}
        run: python production_smoke.py --json
