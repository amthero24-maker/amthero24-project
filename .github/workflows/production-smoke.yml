name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      require_launch_ready:
        description: Fail unless the protected launch report is fully ready
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run retrying read-only production monitor
        id: monitor
        continue-on-error: true
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          EXPECTED_APP_VERSION: ${{ vars.EXPECTED_APP_VERSION }}
          SMOKE_REQUIRE_SIGNATURE: "true"
          PRODUCTION_MONITOR_REQUIRE_LAUNCH_READY: ${{ inputs.require_launch_ready || 'false' }}
          PRODUCTION_MONITOR_ATTEMPTS: "3"
          PRODUCTION_MONITOR_DELAY_SECONDS: "20"
        run: python scripts/production_monitor.py --output production-monitor.json

      - name: Upload sanitized monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-report
          path: production-monitor.json
          if-no-files-found: warn
          retention-days: 14

      - name: Synchronize production incident issue
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: production-monitor.json
        with:
          script: |
            const fs = require('fs');
            const reportPath = process.env.REPORT_PATH;
            if (!fs.existsSync(reportPath)) {
              core.warning('Production monitor report was not created; incident synchronization skipped.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'production-incident';
            const title = '[Production Incident] AmtHero24 production checks failing';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const clean = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/\|/g, '\\|')
              .slice(0, 300);

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'B60205',
                description: 'Automatically managed production health incident',
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);

            if (report.status === 'unhealthy') {
              const rows = (report.checks || []).map((check) =>
                `| ${clean(check.name)} | ${clean(check.status)} | ${clean(check.detail)} |`
              ).join('\n');
              const body = [
                '<!-- amthero24-production-incident -->',
                '## Production checks are failing',
                '',
                `Detected: \`${clean(report.generated_at)}\``,
                `Attempts: **${Number(report.attempts_run || 0)} / ${Number(report.attempts_configured || 0)}**`,
                '',
                '| Check | Status | Safe detail |',
                '|---|---|---|',
                rows || '| monitor | fail | No check results were produced |',
                '',
                `Workflow run: [open diagnostics](${runUrl})`,
                '',
                '> This issue is managed automatically. The report contains no phone numbers, messages, documents, credentials, headers, production URL, or response bodies.',
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                  labels: [label],
                });
                core.notice(`Updated production incident #${existing.number}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: [label],
                });
                core.notice(`Created production incident #${created.data.number}.`);
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Production checks recovered at \`${clean(report.generated_at)}\`. Verification run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed recovered production incident #${existing.number}.`);
            } else if (report.recovered_after_retry) {
              core.notice(`Production recovered during retry ${report.attempts_run}; no incident was opened.`);
            }

      - name: Fail workflow when production remains unhealthy
        if: steps.monitor.outcome == 'failure'
        run: exit 1
