name: Closed Beta Admission

on:
  pull_request:
    paths:
      - closed_beta_admission.py
      - closed_beta_admission_repository.py
      - closed_beta_metrics.py
      - admin_extensions.py
      - launch_extensions.py
      - tests/test_closed_beta_admission.py
      - tests/test_closed_beta_admission_repository.py
      - tests/test_closed_beta_metrics.py
      - tests/test_postgresql_closed_beta_admission.py
      - tests/test_postgresql_closed_beta_metrics.py
      - .github/workflows/closed-beta-admission.yml
  push:
    branches: [main]
    paths:
      - closed_beta_admission.py
      - closed_beta_admission_repository.py
      - closed_beta_metrics.py
      - admin_extensions.py
      - launch_extensions.py
      - tests/test_closed_beta_admission.py
      - tests/test_closed_beta_admission_repository.py
      - tests/test_closed_beta_metrics.py
      - tests/test_postgresql_closed_beta_admission.py
      - tests/test_postgresql_closed_beta_metrics.py
      - .github/workflows/closed-beta-admission.yml

permissions:
  contents: read

jobs:
  admission-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile admission modules
        run: >-
          python -m compileall -q
          closed_beta_admission.py
          closed_beta_admission_repository.py
          closed_beta_metrics.py
      - name: Run deterministic admission and monitoring tests
        run: >-
          python -m pytest -q
          tests/test_closed_beta_admission.py
          tests/test_closed_beta_admission_repository.py
          tests/test_closed_beta_metrics.py

  admission-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amthero24_beta_admission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amthero24_beta_admission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amthero24_beta_admission_test
      DATABASE_FALLBACK_ALLOWED: "false"
      DB_POOL_MAX: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Run atomic PostgreSQL admission and monitoring tests
        run: >-
          python -m pytest -vv --tb=short
          tests/test_postgresql_closed_beta_admission.py
          tests/test_postgresql_closed_beta_metrics.py
