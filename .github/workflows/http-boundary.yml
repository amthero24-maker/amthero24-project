name: HTTP Boundary

on:
  pull_request:
    paths:
      - ".env.example"
      - "http_boundary.py"
      - "log_safety.py"
      - "webhook_security.py"
      - "tests/test_http_boundary.py"
      - "tests/test_log_safety.py"
      - "tests/test_webhook_security.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "http_boundary.py"
      - "log_safety.py"
      - "webhook_security.py"
      - "tests/test_http_boundary.py"
      - "tests/test_log_safety.py"
      - "tests/test_webhook_security.py"
      - ".github/workflows/**"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-http-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Run HTTP boundary and webhook regression suite
        id: boundary_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=short --junitxml=http-boundary-junit.xml \
            tests/test_http_boundary.py tests/test_log_safety.py tests/test_webhook_security.py \
            2>&1 | tee http-boundary-tests.log
      - name: Upload sanitized HTTP boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-boundary-report
          path: |
            http-boundary-junit.xml
            http-boundary-tests.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce HTTP boundary test outcome
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.boundary_tests.outcome }}
        run: test "$TEST_OUTCOME" = "success"
