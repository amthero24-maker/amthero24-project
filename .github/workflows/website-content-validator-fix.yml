name: Website Content Validator Fix

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/website-content-validator-fix-trigger.txt"

permissions:
  contents: write

concurrency:
  group: website-content-validator-fix-205
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exact website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Replace broad scanner with scoped source validator
        shell: bash
        run: |
          cat > website/scripts/validate-content.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const failures = [];
          const textExtensions = new Set([
            ".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".css", ".json", ".md", ".txt", ".svg"
          ]);
          const ignoredNames = new Set(["node_modules", ".next", "out", ".git", "coverage"]);
          const sourceRoots = ["app", "components", "content", "lib", "scripts"];

          function fail(message) {
            failures.push(message);
          }

          function exists(relative) {
            return fs.existsSync(path.join(root, relative));
          }

          function walk(relative) {
            const absolute = path.join(root, relative);
            if (!fs.existsSync(absolute)) return [];
            const output = [];
            for (const entry of fs.readdirSync(absolute, { withFileTypes: true })) {
              if (ignoredNames.has(entry.name)) continue;
              const child = path.join(relative, entry.name);
              if (entry.isDirectory()) output.push(...walk(child));
              else if (textExtensions.has(path.extname(entry.name).toLowerCase())) output.push(child);
            }
            return output;
          }

          const sourceFiles = sourceRoots.flatMap(walk);
          for (const topLevel of ["next.config.mjs", "tailwind.config.ts", "postcss.config.mjs", "package.json"] ) {
            if (exists(topLevel)) sourceFiles.push(topLevel);
          }

          const requiredRoutes = [
            "/", "/impressum", "/datenschutz", "/agb", "/widerruf", "/kontakt",
            "/beta", "/cookie-einstellungen", "/barrierefreiheit"
          ];
          const routeFiles = walk("app").filter((file) => file.endsWith("page.tsx") || file.endsWith("page.jsx"));
          const routeFromFile = (file) => {
            let route = file.replace(/^app[\\/]/, "").replace(/[\\/]page\.(tsx|jsx)$/, "");
            route = route.split(/[\\/]/).filter((part) => !/^\(.+\)$/.test(part)).join("/");
            return route ? `/${route}` : "/";
          };
          const routes = new Set(routeFiles.map(routeFromFile));
          for (const route of requiredRoutes) {
            if (!routes.has(route)) fail(`Missing required route: ${route}`);
          }

          const slugs = ["brief-scanner", "termin", "kuendigung", "vertrag", "geld-zurueck", "nachrichten"];
          for (const slug of slugs) {
            for (const extension of ["mp4", "png"]) {
              const media = `public/media/${slug}.${extension}`;
              if (!exists(media)) fail(`Missing local product media: ${media}`);
            }
          }
          if (!exists("public/og-amthero24.png")) fail("Missing local Open Graph image");

          const forbiddenFragments = [
            "googletagmanager.com", "google-analytics.com", "fonts.googleapis.com", "fonts.gstatic.com",
            "connect.facebook.net", "facebook.com/tr", "hotjar.com", "clarity.ms", "segment.com",
            "mixpanel.com", "plausible.io", "umami.is", "cloudflareinsights.com", "unpkg.com", "jsdelivr.net"
          ];
          const combined = sourceFiles.map((file) => {
            try {
              return `\n/* ${file} */\n${fs.readFileSync(path.join(root, file), "utf8")}`;
            } catch {
              fail(`Unable to inspect source file: ${file}`);
              return "";
            }
          }).join("\n");
          const lowered = combined.toLowerCase();
          for (const fragment of forbiddenFragments) {
            if (lowered.includes(fragment)) fail(`Forbidden external tracker/CDN reference: ${fragment}`);
          }
          if (/next\/font\/google/i.test(combined)) fail("Remote Google font import is forbidden");
          if (/dangerouslySetInnerHTML/.test(combined)) fail("dangerouslySetInnerHTML is forbidden on the launch site");
          if (/<script[^>]+src=["']https?:\/\//i.test(combined)) fail("Remote script source is forbidden");

          const hrefs = [...combined.matchAll(/href\s*=\s*["'](\/[a-z0-9äöüß\-\/#]*)["']/gi)].map((match) => match[1]);
          for (const href of hrefs) {
            const route = href.split("#")[0] || "/";
            if (route !== "/" && !routes.has(route)) fail(`Internal link has no page: ${href}`);
          }

          const requiredLegalLinks = ["/impressum", "/datenschutz", "/agb", "/widerruf", "/kontakt", "/beta"];
          for (const link of requiredLegalLinks) {
            if (!combined.includes(`href=\"${link}\"`) && !combined.includes(`href='${link}'`)) {
              fail(`Required legal link is not rendered: ${link}`);
            }
          }

          if (!lowered.includes("künstliche intelligenz") && !lowered.includes("ki-system")) {
            fail("The German-first site must disclose that Sam uses artificial intelligence");
          }
          if (!combined.includes("5 Plätze") && !combined.includes("5 Plätze".toLowerCase())) {
            fail("The Wave 1 capacity message (5 Plätze) is missing");
          }

          if (failures.length) {
            console.error("Website content validation failed:");
            for (const item of failures) console.error(`- ${item}`);
            process.exit(1);
          }
          console.log(`Website content validation passed (${sourceFiles.length} scoped source files, ${routes.size} routes).`);
          EOF
      - name: Validate scoped content boundary
        working-directory: website
        run: npm run content:check
      - name: Commit scoped validator
        shell: bash
        run: |
          set -euo pipefail
          git add website/scripts/validate-content.mjs
          git diff --cached --check
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: scope website content validation to launch source"
          git push origin HEAD:feat/pre-go-launch-package-205
      - name: Re-run legal lock
        working-directory: website
        run: npm run legal:check
      - name: Run website lint
        working-directory: website
        run: npm run lint
      - name: Build standalone Next.js site
        working-directory: website
        run: npm run build
      - name: Prove strict GO remains blocked
        working-directory: website
        shell: bash
        run: |
          if npm run go:check; then
            echo "Strict GO unexpectedly passed." >&2
            exit 1
          fi
          echo "Strict GO remains correctly blocked."
