name: Website Content Validator Fix V3

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/website-content-validator-fix-v3-trigger.txt"

permissions:
  contents: write

concurrency:
  group: website-content-validator-fix-v3-205
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exact website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Install deterministic source validator
        shell: bash
        run: |
          cat > website/scripts/validate-content.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const failures = [];
          const requiredPages = [
            "app/page.tsx",
            "app/impressum/page.tsx",
            "app/datenschutz/page.tsx",
            "app/agb/page.tsx",
            "app/widerruf/page.tsx",
            "app/kontakt/page.tsx",
            "app/beta/page.tsx",
            "app/cookie-einstellungen/page.tsx",
            "app/barrierefreiheit/page.tsx",
          ];
          const mediaSlugs = [
            "brief-scanner", "termin", "kuendigung", "vertrag", "geld-zurueck", "nachrichten"
          ];
          const forbiddenHosts = [
            "googletagmanager.com", "google-analytics.com", "fonts.googleapis.com", "fonts.gstatic.com",
            "connect.facebook.net", "facebook.com/tr", "hotjar.com", "clarity.ms", "segment.com",
            "mixpanel.com", "plausible.io", "umami.is", "cloudflareinsights.com", "unpkg.com", "jsdelivr.net"
          ];
          const roots = ["app", "components", "content", "lib"];
          const allowedExtensions = new Set([".js", ".jsx", ".mjs", ".ts", ".tsx", ".css", ".json", ".md", ".mdx", ".svg"]);

          const exists = (relative) => fs.existsSync(path.join(root, relative));
          for (const page of requiredPages) {
            if (!exists(page)) failures.push(`Missing required page: ${page}`);
          }
          for (const slug of mediaSlugs) {
            for (const extension of ["mp4", "png"]) {
              const media = `public/media/${slug}.${extension}`;
              if (!exists(media)) failures.push(`Missing local media: ${media}`);
            }
          }
          if (!exists("public/og-amthero24.png")) failures.push("Missing Open Graph image");

          function walk(relative) {
            const absolute = path.join(root, relative);
            if (!fs.existsSync(absolute)) return [];
            const files = [];
            for (const entry of fs.readdirSync(absolute, { withFileTypes: true })) {
              if (["node_modules", ".next", "out", "coverage"].includes(entry.name)) continue;
              const child = path.join(relative, entry.name);
              if (entry.isDirectory()) files.push(...walk(child));
              else if (allowedExtensions.has(path.extname(entry.name).toLowerCase())) files.push(child);
            }
            return files;
          }

          const sourceFiles = roots.flatMap(walk);
          for (const file of ["next.config.mjs", "tailwind.config.ts", "postcss.config.mjs", "package.json"]) {
            if (exists(file)) sourceFiles.push(file);
          }
          const source = sourceFiles.map((file) => fs.readFileSync(path.join(root, file), "utf8")).join("\n");
          const lowered = source.toLocaleLowerCase("de-DE");

          for (const host of forbiddenHosts) {
            if (lowered.includes(host)) failures.push(`Forbidden tracker or CDN: ${host}`);
          }
          if (/next\/font\/google/i.test(source)) failures.push("Remote Google fonts are forbidden");
          if (/<script[^>]+src=["']https?:\/\//i.test(source)) failures.push("Remote scripts are forbidden");
          if (/dangerouslySetInnerHTML/.test(source)) failures.push("dangerouslySetInnerHTML is forbidden");

          const legalRoutes = [
            "/impressum", "/datenschutz", "/agb", "/widerruf", "/kontakt", "/beta",
            "/cookie-einstellungen", "/barrierefreiheit"
          ];
          for (const route of legalRoutes) {
            if (!source.includes(route)) failures.push(`Legal route is not referenced by the site: ${route}`);
          }
          if (!/(künstliche intelligenz|ki-system|\bki\b)/i.test(source)) {
            failures.push("German AI transparency wording is missing");
          }
          if (!/(5\s*(plätze|plaetze|places|slots))/i.test(source)) {
            failures.push("Wave 1 capacity wording is missing");
          }

          if (failures.length) {
            console.error("Website content validation failed:");
            failures.forEach((failure) => console.error(`- ${failure}`));
            process.exit(1);
          }
          console.log(`Website content validation passed (${sourceFiles.length} scoped source files).`);
          EOF
      - name: Validate deterministic content boundary
        working-directory: website
        run: npm run content:check
      - name: Commit validator before build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git add website/scripts/validate-content.mjs
          git diff --cached --check
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "fix: make website content validation deterministic"
            git push origin HEAD:feat/pre-go-launch-package-205
          fi
      - name: Validate legal production lock
        working-directory: website
        run: npm run legal:check
      - name: Run website lint
        working-directory: website
        run: npm run lint
      - name: Build standalone Next.js site
        working-directory: website
        run: npm run build
      - name: Prove strict GO remains blocked
        working-directory: website
        shell: bash
        run: |
          if npm run go:check; then
            echo "Strict GO unexpectedly passed." >&2
            exit 1
          fi
          echo "Strict GO remains correctly blocked."
