name: Website CI

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: write

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SITE_URL: https://amthero24.de
      NEXT_PUBLIC_SITE_INDEXABLE: "false"
      NEXT_PUBLIC_BETA_CTA_ENABLED: "false"
      NEXT_PUBLIC_BETA_CTA_URL: ""
      NEXT_PUBLIC_BETA_CAPACITY: "5"
      NEXT_PUBLIC_BETA_NOTICE_VERSION: 2026-08-wave1-v2-ai-transparent
      LEGAL_PRODUCTION_READY: "false"
      LEGAL_OPERATOR_NAME: "AmtHero24 CI Test Operator"
      LEGAL_TRADING_NAME: AmtHero24
      LEGAL_OPERATOR_STATUS: "[REQUIRED]"
      LEGAL_COUNTRY: "[REQUIRED]"
      LEGAL_EMAIL_INFO: info@amthero24.de
      LEGAL_EMAIL_SUPPORT: support@amthero24.de
      LEGAL_PROVIDER_DPAS_CONFIRMED: "false"
      LEGAL_META_TERMS_CONFIRMED: "false"
      LEGAL_GROQ_ZDR_ENABLED: "false"
      LEGAL_RAILWAY_REGION_CONFIRMED: "false"
      LEGAL_WEBSITE_REVIEW_CONFIRMED: "false"
      LEGAL_VSBG_REVIEW_CONFIRMED: "false"
      DOMAIN_PRIMARY_TLS_CONFIRMED: "false"
      DOMAIN_REDIRECTS_CONFIRMED: "false"
      EMAIL_INBOUND_ROUTING_CONFIRMED: "false"
      EMAIL_OUTBOUND_AUTH_CONFIRMED: "false"
      BETA_NOTICE_OWNER_APPROVED: "false"
      AI_TRANSPARENCY_REVIEW_CONFIRMED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate scoped Next.js security-update candidate
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=16.3.0
          npm pkg set devDependencies.eslint-config-next=16.3.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload candidate manifests
        uses: actions/upload-artifact@v7
        with:
          name: website-next-16.3.0-candidate
          path: |
            website/package.json
            website/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit scoped security manifests to PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/website-npm-supply-chain-205'
        working-directory: .
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package.json website/package-lock.json
          if git diff --cached --quiet; then
            echo "Scoped manifests already committed."
            exit 0
          fi
          git commit -m "deps: update website Next.js to 16.3.0"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production npm dependencies
        id: npm_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Generate production CycloneDX SBOM
        id: npm_sbom
        continue-on-error: true
        run: npm sbom --omit=dev --sbom-format cyclonedx > npm-sbom.cdx.json
      - name: Upload website supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-supply-chain-evidence
          path: |
            website/npm-audit.json
            website/npm-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce website supply-chain outcomes
        if: always()
        shell: bash
        env:
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          NPM_SBOM_OUTCOME: ${{ steps.npm_sbom.outcome }}
        run: |
          test "$NPM_AUDIT_OUTCOME" = "success"
          test "$NPM_SBOM_OUTCOME" = "success"
      - name: Generate local synthetic media assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil fonts-dejavu-core
          python3 scripts/generate-demo-assets.py
      - name: Validate fail-closed legal and launch configuration
        run: npm run legal:check
      - name: Validate content, legal routes and local media
        run: npm run content:check
      - name: Lint website
        run: npm run lint
      - name: Prove strict GO remains blocked before owner/legal completion
        shell: bash
        run: |
          set -euo pipefail
          if npm run go:check; then
            echo "Strict GO unexpectedly passed with pre-GO variables." >&2
            exit 1
          fi
          echo "Expected fail-closed GO rejection confirmed."
      - name: Prove GO requires complete synthetic legal facts and a safe WhatsApp CTA
        shell: bash
        env:
          LEGAL_PRODUCTION_READY: "true"
          LEGAL_OPERATOR_STATUS: "Synthetic CI test entity"
          LEGAL_SERVICE_ADDRESS: "CI Test Address, 00000 Teststadt, Germany"
          LEGAL_COUNTRY: Germany
          LEGAL_PROVIDER_DPAS_CONFIRMED: "true"
          LEGAL_META_TERMS_CONFIRMED: "true"
          LEGAL_RAILWAY_REGION_CONFIRMED: "true"
          LEGAL_WEBSITE_REVIEW_CONFIRMED: "true"
          LEGAL_VSBG_REVIEW_CONFIRMED: "true"
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          NEXT_PUBLIC_BETA_CTA_ENABLED: "true"
          NEXT_PUBLIC_BETA_CTA_URL: "https://wa.me/491000000000?text=AmtHero24%20Beta"
          DOMAIN_PRIMARY_TLS_CONFIRMED: "true"
          DOMAIN_REDIRECTS_CONFIRMED: "true"
          EMAIL_INBOUND_ROUTING_CONFIRMED: "true"
          EMAIL_OUTBOUND_AUTH_CONFIRMED: "true"
          BETA_NOTICE_OWNER_APPROVED: "true"
          AI_TRANSPARENCY_REVIEW_CONFIRMED: "true"
        run: |
          set -euo pipefail
          npm run go:check
          if LEGAL_SERVICE_ADDRESS='' npm run go:check; then
            echo "GO unexpectedly accepted a missing service address." >&2
            exit 1
          fi
          if LEGAL_OPERATOR_STATUS='[REQUIRED]' npm run go:check; then
            echo "GO unexpectedly accepted a placeholder operator status." >&2
            exit 1
          fi
          if LEGAL_PROVIDER_DPAS_CONFIRMED='false' npm run go:check; then
            echo "GO unexpectedly accepted an unconfirmed processor/DPA gate." >&2
            exit 1
          fi
          if NEXT_PUBLIC_BETA_CTA_URL='' npm run go:check; then
            echo "GO unexpectedly accepted an enabled CTA without a target." >&2
            exit 1
          fi
          if NEXT_PUBLIC_BETA_CTA_URL='https://example.com/join' npm run go:check; then
            echo "GO unexpectedly accepted a non-WhatsApp CTA target." >&2
            exit 1
          fi
          echo "Strict legal facts and safe actionable WhatsApp CTA contract confirmed."
      - name: Build noindex preview artifact
        run: npm run build
      - name: Verify Railway deployment contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('railway.json').read_text())
          assert config['build']['builder'] == 'DOCKERFILE'
          assert config['build']['dockerfilePath'] == 'Dockerfile'
          assert config['deploy']['healthcheckPath'] == '/api/health'
          assert config['deploy']['restartPolicyType'] == 'ON_FAILURE'
          assert isinstance(config['deploy']['restartPolicyMaxRetries'], int)
          PY
          test -f Dockerfile
          test -f app/api/health/route.js
      - name: Build standalone Docker image
        run: docker build --pull=false -t amthero24-website:ci .
      - name: Verify no backend admission activation was introduced
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=node_modules --exclude='.env.example' \
            'CLOSED_BETA_ADMISSION_ENABLED[[:space:]]*=[[:space:]]*true' .; then
            echo 'Website scope must not enable backend Closed Beta admission.' >&2
            exit 1
          fi
      - name: Verify legal and robots routes exist
        shell: bash
        run: |
          set -euo pipefail
          test -f app/robots.js
          test -f app/sitemap.js
          test -f 'app/[legal]/page.jsx'
          test -f app/beta/page.tsx
          for route in impressum datenschutz agb widerruf kontakt cookie-einstellungen barrierefreiheit; do
            grep -q "${route}" 'app/[legal]/page.jsx'
          done
