name: Secret Leak Guard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Scan tracked repository files
        id: scan
        continue-on-error: true
        run: python scripts/scan_repository_secrets.py --json > secret-scan-report.json
      - name: Upload sanitized scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-leak-guard-report
          path: secret-scan-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run scanner tests
        run: python -m pytest -q tests/test_secret_leak_guard.py
      - name: Fail when credential material is detected
        if: steps.scan.outcome == 'failure'
        run: exit 1
