name: Secret Leak Guard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run scanner tests
        run: python -m pip install --quiet -r requirements-dev.txt && python -m pytest -q tests/test_secret_leak_guard.py
      - name: Scan tracked repository files
        run: python scripts/scan_repository_secrets.py --json > secret-scan-report.json
      - name: Upload sanitized scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-leak-guard-report
          path: secret-scan-report.json
          if-no-files-found: warn
          retention-days: 14
