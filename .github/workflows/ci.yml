name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py config.py data_store.py groq_client.py prompts.py whatsapp.py main.py
      - name: Test application
        run: pytest -q tests/test_app.py --tb=short
      - name: Test data store
        run: pytest -q tests/test_data_store.py --tb=short
      - name: Test WhatsApp client
        run: pytest -q tests/test_whatsapp.py --tb=short
