name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py config.py data_store.py groq_client.py prompts.py whatsapp.py main.py
      - name: Test text parsing
        run: python -c 'import app; p={"entry":[{"changes":[{"value":{"messages":[{"id":"1","from":"49123","type":"text","text":{"body":"Hilfe"}}]}}]}]}; assert app.extract_text_messages(p)==[("1","49123","Hilfe")]'
      - name: Test button parsing
        run: python -c 'import app; p={"entry":[{"changes":[{"value":{"messages":[{"id":"2","from":"49123","type":"button","button":{"text":"Ja"}}]}}]}]}; assert app.extract_text_messages(p)==[("2","49123","Ja")]'
      - name: Test interactive parsing
        run: python -c 'import app; p={"entry":[{"changes":[{"value":{"messages":[{"id":"3","from":"49123","type":"interactive","interactive":{"button_reply":{"id":"yes","title":"Ja"}}}]}}]}]}; assert app.extract_text_messages(p)==[("3","49123","Ja")]'
      - name: Test status ignored
        run: python -c 'import app; p={"entry":[{"changes":[{"value":{"statuses":[{}]}}]}]}; assert app.extract_incoming_messages(p)==[]'
      - name: Test application suite
        run: pytest -q tests/test_app.py --tb=short
      - name: Test data store
        run: pytest -q tests/test_data_store.py --tb=short
      - name: Test WhatsApp client
        run: pytest -q tests/test_whatsapp.py --tb=short
