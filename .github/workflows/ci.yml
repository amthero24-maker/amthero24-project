name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py config.py data_store.py groq_client.py prompts.py whatsapp.py main.py
      - name: Test parsing
        run: pytest -q tests/test_app.py::test_extract_text_button_interactive_and_ignore_statuses tests/test_app.py::test_extract_name_keeps_single_name_flow --tb=short
      - name: Test verification
        run: pytest -q tests/test_app.py::test_verification_success_failure_and_missing_env --tb=short
      - name: Test webhook
        run: pytest -q tests/test_app.py::test_webhook_malformed_status_and_duplicate --tb=short
      - name: Test processing
        run: pytest -q tests/test_app.py::test_process_incoming_success_and_groq_failure tests/test_app.py::test_media_download_failure_gets_safe_reply --tb=short
      - name: Test health
        run: pytest -q tests/test_app.py::test_health_does_not_leak_secrets --tb=short
      - name: Test data store
        run: pytest -q tests/test_data_store.py --tb=short
      - name: Test WhatsApp client
        run: pytest -q tests/test_whatsapp.py --tb=short
