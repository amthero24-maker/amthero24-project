name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py config.py data_store.py groq_client.py prompts.py whatsapp.py main.py
      - name: Test all suites
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=long > pytest.log 2>&1
          status=$?
          cat pytest.log
          exit $status
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 1
