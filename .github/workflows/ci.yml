name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Dependency policy tests
        run: python -m pytest -q tests/test_dependency_policy.py
      - name: Secret leak guard tests
        run: python -m pytest -q tests/test_secret_leak_guard.py
      - name: Tenant isolation tests
        run: python -m pytest -q tests/test_tenant_isolation.py
      - name: Webhook idempotency tests
        run: python -m pytest -q tests/test_message_idempotency.py tests/test_idempotency_extensions.py
      - name: Durable inbound queue policy tests
        run: python -m pytest -q tests/test_durable_queue.py
      - name: Durable queue observability tests
        run: python -m pytest -q tests/test_queue_observability.py
      - name: Outbound delivery receipt tests
        run: python -m pytest -q tests/test_outbound_delivery.py tests/test_outbound_delivery_extensions.py
      - name: Conversation intelligence tests
        run: python -m pytest -q tests/test_conversation_intelligence.py
      - name: Product knowledge tests
        run: python -m pytest -q tests/test_product_knowledge.py
      - name: Onboarding and consent tests
        run: python -m pytest -q tests/test_onboarding.py
      - name: Memory recovery tests
        run: python -m pytest -q tests/test_memory_recovery.py
      - name: Hero Memory tests
        run: python -m pytest -q tests/test_hero_memory.py
      - name: Mission Engine tests
        run: python -m pytest -q tests/test_mission_engine.py tests/test_mission_intelligence.py
      - name: Brief Scanner planning tests
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_action_proposal.py
          tests/test_brief_scanner_mission_planner.py
          tests/test_brief_scanner_draft_planner.py
          tests/test_brief_scanner_reminder_planner.py
          tests/test_brief_scanner_consent_workflow.py
          tests/test_brief_scanner_mission_engine.py
      - name: Relationship Engine tests
        run: python -m pytest -q tests/test_relationship_engine.py tests/test_application_composition.py
      - name: Voice Input tests
        run: python -m pytest -q tests/test_voice_service.py tests/test_application_voice.py
      - name: Document extraction tests
        run: python -m pytest -q tests/test_document_service.py tests/test_application_documents.py tests/test_application_pdf.py tests/test_document_extensions.py
      - name: Document fact extraction tests
        run: python -m pytest -q tests/test_document_intelligence.py
      - name: Pending document repository tests
        run: python -m pytest -q tests/test_document_action_repository.py
      - name: Document action WhatsApp tests
        run: python -m pytest -q tests/test_document_action_extensions.py
      - name: Reminder Engine tests
        run: python -m pytest -q tests/test_reminder_engine.py tests/test_reminder_extensions.py
      - name: Privacy and retention tests
        run: python -m pytest -q tests/test_privacy_engine.py tests/test_privacy_extensions.py
      - name: Entitlement Engine tests
        run: python -m pytest -q tests/test_entitlement_engine.py tests/test_entitlement_extensions.py
      - name: Abuse guard tests
        run: python -m pytest -q tests/test_abuse_guard.py tests/test_abuse_extensions.py
      - name: Provider reliability tests
        run: python -m pytest -q tests/test_provider_reliability.py tests/test_provider_extensions.py
      - name: Beta launch readiness tests
        run: python -m pytest -q tests/test_launch_readiness.py tests/test_launch_extensions.py tests/test_storage_launch_policy.py
      - name: Human support tests
        run: python -m pytest -q tests/test_support_handoff.py tests/test_support_extensions.py
      - name: Anonymous feedback tests
        run: python -m pytest -q tests/test_feedback_engine.py tests/test_feedback_extensions.py
      - name: Production and deployment operations tests
        run: python -m pytest -q tests/test_production_smoke.py tests/test_postgres_operations.py tests/test_reminder_encryption_migration.py tests/test_release_preflight.py tests/test_production_monitor.py tests/test_railway_contract.py tests/test_deployment_stability.py tests/test_database_migrations.py
      - name: Admin aggregate metric tests
        run: python -m pytest -q tests/test_admin_metrics.py
      - name: Admin protected endpoint tests
        run: python -m pytest -q tests/test_admin_extensions.py
      - name: Production, encryption, and webhook security tests
        run: python -m pytest -q tests/test_runtime_health.py tests/test_webhook_security.py tests/test_storage_factory.py tests/test_encryption_policy.py
      - name: Application mission tests
        run: python -m pytest -q tests/test_app_missions.py
      - name: Application tests
        run: python -m pytest -q tests/test_app.py
      - name: Data store tests
        run: python -m pytest -q tests/test_data_store.py
      - name: Groq reasoning safety tests
        run: python -m pytest -q tests/test_groq_reasoning.py
      - name: Prompt language safety tests
        run: python -m pytest -q tests/test_prompts.py
      - name: WhatsApp tests
        run: python -m pytest -q tests/test_whatsapp.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amthero24_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amthero24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amthero24_test
      DATABASE_FALLBACK_ALLOWED: "false"
      DB_POOL_MAX: "4"
      SCHEMA_MIGRATION_LOCK_TIMEOUT_SECONDS: "5"
      GROQ_API_KEY: isolated-groq-key
      WHATSAPP_TOKEN: isolated-whatsapp-token
      PHONE_NUMBER_ID: isolated-phone-id
      VERIFY_TOKEN: isolated-verify-token
      META_APP_SECRET: isolated-meta-secret
      WEBHOOK_SIGNATURE_REQUIRED: "true"
      ADMIN_API_TOKEN: admin-ci-2026-unique-8xK2mP7qR4vN
      DURABLE_QUEUE_ENABLED: "true"
      MESSAGE_QUEUE_ENCRYPTION_KEY: queue-ci-2026-unique-7rT4mQ9xLp2V8nK5
      OUTBOUND_DELIVERY_RETENTION_DAYS: "30"
      REMINDER_WORKER_ENABLED: "false"
      REMINDER_ENCRYPTION_KEY: reminder-ci-2026-unique-7fA9xQ2mLp8V
      REMINDER_LEGACY_TOKEN_DECRYPTION_ENABLED: "false"
      SUPPORT_API_TOKEN: support-api-ci-2026-unique-9qW3eR7tYu2P
      SUPPORT_ENCRYPTION_KEY: support-key-ci-2026-unique-4kT8zN1pRw6M
      HUMAN_SUPPORT_ENABLED: "false"
      PRIVACY_RETENTION_ENABLED: "true"
      PROVIDER_TELEMETRY_ENABLED: "true"
      ABUSE_GUARD_ENABLED: "true"
      ABUSE_GUARD_ENFORCEMENT_ENABLED: "true"
      ENTITLEMENT_ENFORCEMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Run real PostgreSQL integration suite
        id: postgres_tests
        continue-on-error: true
        run: python -m pytest -vv --tb=short --junitxml=postgres-junit.xml tests/test_postgresql_integration.py tests/test_postgresql_tenant_isolation.py tests/test_postgresql_message_idempotency.py tests/test_postgresql_durable_queue.py tests/test_postgresql_queue_observability.py tests/test_postgresql_outbound_delivery.py tests/test_postgresql_reminder_migration_atomicity.py tests/test_postgresql_schema_migrations.py 2>&1 | tee postgres-test.log
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-diagnostics
          path: |
            postgres-junit.xml
            postgres-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when PostgreSQL integration failed
        if: steps.postgres_tests.outcome == 'failure'
        run: exit 1

  postgres-recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amthero24_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amthero24_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECOVERY_SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amthero24_source
      RECOVERY_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amthero24_restore
      RECOVERY_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RECOVERY_TARGET_DATABASE: amthero24_restore
      DB_POOL_MAX: "4"
      MESSAGE_QUEUE_ENCRYPTION_KEY: queue-recovery-2026-unique-8uY5nR2mKp7Q
      OUTBOUND_DELIVERY_RETENTION_DAYS: "30"
      REMINDER_ENCRYPTION_KEY: reminder-recovery-2026-unique-3dF8kL1pQs7V
      SUPPORT_ENCRYPTION_KEY: support-recovery-2026-unique-5hJ9mN2rTx4W
      PROVIDER_TELEMETRY_ENABLED: "true"
      GROQ_CIRCUIT_BREAKER_ENABLED: "true"
      ABUSE_GUARD_ENABLED: "true"
      ABUSE_GUARD_ENFORCEMENT_ENABLED: "true"
      ENTITLEMENT_ENFORCEMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Ensure PostgreSQL client tools
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version
          psql --version
      - name: Run encrypted backup and restore drill
        id: recovery_tests
        continue-on-error: true
        run: python -m pytest -vv --tb=short --junitxml=recovery-junit.xml tests/test_postgresql_recovery_drill.py 2>&1 | tee recovery-test.log
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-recovery-drill-diagnostics
          path: |
            recovery-junit.xml
            recovery-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when recovery drill failed
        if: steps.recovery_tests.outcome == 'failure'
        run: exit 1
