name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py config.py conversation_intelligence.py data_store.py groq_client.py prompts.py whatsapp.py main.py
      - name: Conversation intelligence tests
        run: python -m pytest -q tests/test_conversation_intelligence.py
      - name: Application tests
        run: python -m pytest -q tests/test_app.py
      - name: Data store tests
        run: python -m pytest -q tests/test_data_store.py
      - name: Groq reasoning safety tests
        run: python -m pytest -q tests/test_groq_reasoning.py
      - name: WhatsApp tests
        run: python -m pytest -q tests/test_whatsapp.py
