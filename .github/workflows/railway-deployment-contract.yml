name: Railway Deployment Contract

on:
  pull_request:
    paths:
      - railway.json
      - Procfile
      - railway_contract.py
      - tests/test_railway_contract.py
      - .github/workflows/railway-deployment-contract.yml
  push:
    branches: [main]
    paths:
      - railway.json
      - Procfile
      - railway_contract.py
      - tests/test_railway_contract.py
      - .github/workflows/railway-deployment-contract.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Validate Railway configuration contract
        id: contract
        continue-on-error: true
        run: python railway_contract.py --output railway-contract.json
      - name: Run Railway contract regression tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q tests/test_railway_contract.py
      - name: Upload sanitized Railway contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: railway-deployment-contract
          path: railway-contract.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Railway deployment contract
        if: steps.contract.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
