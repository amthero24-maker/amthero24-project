name: Brief Scanner Runtime Adapter

on:
  pull_request:
    paths:
      - "brief_scanner_*.py"
      - "tests/test_brief_scanner_*.py"
      - ".env.example"
      - ".github/workflows/brief-scanner-runtime-adapter.yml"
  push:
    branches: [main]
    paths:
      - "brief_scanner_*.py"
      - "tests/test_brief_scanner_*.py"
      - ".env.example"
      - ".github/workflows/brief-scanner-runtime-adapter.yml"

permissions:
  contents: read

jobs:
  runtime-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile Runtime Adapter boundary
        run: >-
          python -m compileall -q
          brief_scanner_runtime_adapter.py
          tests/test_brief_scanner_runtime_adapter.py
      - name: Run Runtime Adapter and authorization suites
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_runtime_adapter.py
          tests/test_brief_scanner_execution_boundary.py
          tests/test_brief_scanner_mission_engine.py
      - name: Re-run core security contracts
        run: >-
          python -m pytest -q
          tests/test_dependency_policy.py
          tests/test_secret_leak_guard.py
          tests/test_environment_contract.py
          tests/test_runtime_health.py
          tests/test_webhook_security.py
          tests/test_log_safety.py
