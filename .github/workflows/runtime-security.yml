name: Runtime Security Regression

on:
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/runtime-security.yml"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/runtime-security.yml"
      - "requirements*.txt"
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Run runtime security regression suite
        id: security_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=short --junitxml=runtime-security-junit.xml \
            tests/test_runtime_health.py \
            tests/test_webhook_security.py \
            tests/test_storage_factory.py \
            tests/test_encryption_policy.py \
            2>&1 | tee runtime-security-tests.log
      - name: Upload runtime security diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-security-diagnostics
          path: |
            runtime-security-junit.xml
            runtime-security-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce runtime security outcome
        if: always()
        env:
          SECURITY_TEST_OUTCOME: ${{ steps.security_tests.outcome }}
        run: test "$SECURITY_TEST_OUTCOME" = "success"
