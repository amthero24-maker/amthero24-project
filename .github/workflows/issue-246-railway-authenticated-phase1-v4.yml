name: Issue 246 private Railway authentication and phase 1 v4

on:
  push:
    branches:
      - ops/issue-246-durable-backup-infrastructure
    paths:
      - .github/workflows/issue-246-railway-authenticated-phase1-v4.yml

permissions:
  contents: write

concurrency:
  group: issue-246-private-railway-authentication-v3
  cancel-in-progress: true

jobs:
  authenticate-and-configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: 022c1c37-69bd-4744-b255-f503391b0fd4
      ENVIRONMENT_ID: 7706572e-714d-4593-9074-85b6943fd82a
      BACKUP_SERVICE_ID: 9f61e86c-7026-45f7-8284-0803fee61798
      BACKUP_SERVICE_NAME: amthero24-backup
      EXPECTED_MOUNT_PATH: /backups
      EXPECTED_CONFIG_FILE: /railway.backup.json
      EXPECTED_CRON: "17 2 * * *"
      EXPECTED_START_COMMAND: python -m scripts.postgres_backup
      EXPECTED_DOCKERFILE: Dockerfile.backup
      RAILWAY_CLI_VERSION: 5.37.7
      RAILWAY_CLI_SHA256: 9aebfd69103b085a43a3e8755bbbfff9138428602b784b21f95ea5b291cb5ca3
      GH_API_TOKEN: ${{ github.token }}
      DEVICE_BUNDLE_PATH: .github/issue-246/device-auth.enc

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned official Railway CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/railway-cli.tar.gz"
          install_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RAILWAY_CLI_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/railway" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Prepare ASCII-safe encrypted handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/issue-246/phase1.sh "$RUNNER_TEMP/phase1-v4.sh"
          SCRIPT="$RUNNER_TEMP/phase1-v4.sh" python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["SCRIPT"])
          text = path.read_text(encoding="utf-8")
          old_local = "  local public_key encrypted content payload existing sha"
          new_local = "  local public_key encrypted ciphertext_b64 content payload existing sha"
          old_content = '  content="$(base64 -w 0 "$encrypted")"'
          new_content = "  ciphertext_b64=\"$(base64 -w 0 \"$encrypted\")\"\n  content=\"$(printf '%s' \"$ciphertext_b64\" | base64 -w 0)\""
          if text.count(old_local) != 1 or text.count(old_content) != 1:
              raise SystemExit("expected phase1 handoff markers were not found exactly once")
          text = text.replace(old_local, new_local).replace(old_content, new_content)
          path.write_text(text, encoding="utf-8")
          PY
          bash -n "$RUNNER_TEMP/phase1-v4.sh"

      - name: Authenticate privately and complete phase 1
        shell: bash
        run: bash "$RUNNER_TEMP/phase1-v4.sh"

      - name: Upload privacy-safe phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-246-authenticated-phase1-v4
          path: issue-246-authenticated-phase1-v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce phase 1 result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("issue-246-authenticated-phase1-v2.json").read_text(encoding="utf-8"))
          if payload.get("status") != "pass":
              raise SystemExit(f"Issue #246 phase 1 v4 failed: {payload.get('reason', 'unknown')}")
          print("Issue #246 phase 1 v4 passed.")
          PY
