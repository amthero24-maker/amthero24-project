name: Brief Scanner Execution Boundary

on:
  pull_request:
    paths:
      - "brief_scanner_*.py"
      - "tests/test_brief_scanner_*.py"
      - ".github/workflows/brief-scanner-execution-boundary.yml"
  push:
    branches: [main]
    paths:
      - "brief_scanner_*.py"
      - "tests/test_brief_scanner_*.py"
      - ".github/workflows/brief-scanner-execution-boundary.yml"

permissions:
  contents: read

jobs:
  execution-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile Brief Scanner boundary
        run: python -m compileall -q brief_scanner_execution_boundary.py tests/test_brief_scanner_execution_boundary.py
      - name: Run complete Brief Scanner planning and execution-boundary suite
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_action_proposal.py
          tests/test_brief_scanner_mission_planner.py
          tests/test_brief_scanner_draft_planner.py
          tests/test_brief_scanner_reminder_planner.py
          tests/test_brief_scanner_consent_workflow.py
          tests/test_brief_scanner_execution_boundary.py
      - name: Re-run core security contracts
        run: >-
          python -m pytest -q
          tests/test_dependency_policy.py
          tests/test_secret_leak_guard.py
          tests/test_runtime_health.py
          tests/test_webhook_security.py
          tests/test_log_safety.py
