name: Brief Scanner Draft Generation

on:
  pull_request:
    paths:
      - "brief_scanner_draft_*.py"
      - "brief_scanner_execution_boundary.py"
      - "tests/test_brief_scanner_draft_*.py"
      - ".github/workflows/brief-scanner-draft-generation.yml"
  push:
    branches: [main]
    paths:
      - "brief_scanner_draft_*.py"
      - "brief_scanner_execution_boundary.py"
      - "tests/test_brief_scanner_draft_*.py"
      - ".github/workflows/brief-scanner-draft-generation.yml"

permissions:
  contents: read

jobs:
  draft-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile Draft Generation boundary
        run: >-
          python -m compileall -q
          brief_scanner_draft_boundary.py
          brief_scanner_draft_groq_provider.py
          tests/test_brief_scanner_draft_boundary.py
          tests/test_brief_scanner_draft_groq_provider.py
      - name: Run Draft Generation contracts
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_draft_boundary.py
          tests/test_brief_scanner_draft_groq_provider.py
          tests/test_brief_scanner_draft_planner.py
          tests/test_brief_scanner_execution_boundary.py
      - name: Re-run security contracts
        run: >-
          python -m pytest -q
          tests/test_dependency_policy.py
          tests/test_secret_leak_guard.py
          tests/test_environment_contract.py
          tests/test_runtime_health.py
          tests/test_webhook_security.py
          tests/test_log_safety.py
