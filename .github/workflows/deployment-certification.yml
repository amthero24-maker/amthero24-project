name: Deployment Certification

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact AmtHero24 version expected in production
        required: true
        type: string
      samples:
        description: Consecutive healthy samples required (2-6)
        required: true
        default: "3"
        type: string
      delay_seconds:
        description: Delay between healthy samples (0-300 seconds)
        required: true
        default: "30"
        type: string
      require_launch_ready:
        description: Require the protected launch decision to be fully ready
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: deployment-certification
  cancel-in-progress: true

jobs:
  certify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_version || vars.EXPECTED_APP_VERSION }}
      DEPLOYMENT_STABILITY_SAMPLES: ${{ inputs.samples || '3' }}
      DEPLOYMENT_STABILITY_DELAY_SECONDS: ${{ inputs.delay_seconds || '30' }}
      DEPLOYMENT_STABILITY_REQUIRE_LAUNCH_READY: ${{ inputs.require_launch_ready || 'true' }}
      SMOKE_TIMEOUT_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve exact expected application version
        shell: bash
        run: |
          if [ -n "${EXPECTED_APP_VERSION}" ]; then
            printf 'Using configured expected application version.\n'
            exit 0
          fi
          resolved_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('config.py').read_text(encoding='utf-8'))
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == 'APP_VERSION' for target in node.targets):
                  value = ast.literal_eval(node.value)
                  if isinstance(value, str) and value.strip():
                      print(value.strip())
                      raise SystemExit(0)
          raise SystemExit('APP_VERSION was not found in config.py')
          PY
          )"
          printf 'EXPECTED_APP_VERSION=%s\n' "${resolved_version}" >> "${GITHUB_ENV}"

      - name: Wait for Railway deployment on main updates
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run consecutive read-only deployment certification
        id: certification
        continue-on-error: true
        run: python scripts/deployment_stability.py --output deployment-stability.json

      - name: Collect sanitized non-ready launch codes
        if: always()
        run: python scripts/launch_readiness_codes.py

      - name: Run protected reminder encryption preflight
        id: reminder_preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          allowed = {
              'mode',
              'total',
              'already_current',
              'decryptable_old_key',
              'decryptable_legacy_token',
              'unreadable',
              'migrated',
              'safe_to_apply',
          }
          output = Path('reminder-encryption-preflight.json')
          base_url = os.environ.get('PRODUCTION_BASE_URL', '').strip().rstrip('/')
          token = os.environ.get('ADMIN_API_TOKEN', '').strip()
          if not base_url or not token:
              output.write_text(json.dumps({'status': 'unavailable'}, sort_keys=True), encoding='utf-8')
              raise SystemExit(1)
          request = urllib.request.Request(
              f'{base_url}/admin/reminder-encryption-preflight',
              headers={
                  'X-Admin-Token': token,
                  'Accept': 'application/json',
                  'User-Agent': 'AmtHero24-Certification/1.0',
              },
              method='GET',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8'))
          except (urllib.error.URLError, TimeoutError, ValueError, UnicodeError):
              output.write_text(json.dumps({'status': 'unavailable'}, sort_keys=True), encoding='utf-8')
              raise SystemExit(1)
          if not isinstance(payload, dict):
              output.write_text(json.dumps({'status': 'invalid'}, sort_keys=True), encoding='utf-8')
              raise SystemExit(1)
          clean = {key: payload[key] for key in allowed if key in payload}
          output.write_text(json.dumps(clean, sort_keys=True), encoding='utf-8')
          if clean.get('mode') != 'dry-run' or clean.get('migrated') not in {0, None}:
              raise SystemExit(1)
          if clean.get('safe_to_apply') is not True or int(clean.get('unreadable', 1) or 0) != 0:
              raise SystemExit(1)
          PY

      - name: Upload sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-certification-${{ github.run_id }}
          path: |
            deployment-stability.json
            launch-readiness-codes.json
            reminder-encryption-preflight.json
          if-no-files-found: error
          retention-days: 14

      - name: Record sanitized certification result
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: deployment-stability.json
          LAUNCH_CODES_PATH: launch-readiness-codes.json
          REMINDER_PREFLIGHT_PATH: reminder-encryption-preflight.json
          CERTIFICATION_ISSUE: "67"
        with:
          script: |
            const fs = require('fs');
            const path = process.env.REPORT_PATH;
            if (!fs.existsSync(path)) {
              core.warning('Certification report was not created; issue update skipped.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            let launch = { status: 'unavailable', codes: [] };
            if (fs.existsSync(process.env.LAUNCH_CODES_PATH)) {
              launch = JSON.parse(fs.readFileSync(process.env.LAUNCH_CODES_PATH, 'utf8'));
            }
            let reminder = { status: 'unavailable' };
            if (fs.existsSync(process.env.REMINDER_PREFLIGHT_PATH)) {
              reminder = JSON.parse(fs.readFileSync(process.env.REMINDER_PREFLIGHT_PATH, 'utf8'));
            }
            const clean = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/[`|]/g, '')
              .slice(0, 240);
            const status = report.status === 'stable' ? 'stable' : 'unstable';
            const codes = Array.isArray(launch.codes) ? launch.codes.map(clean).filter(Boolean).slice(0, 30) : [];
            const reminderStatus = reminder.safe_to_apply === true && Number(reminder.unreadable || 0) === 0
              ? 'safe-to-apply'
              : clean(reminder.status || 'not-ready');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Automated strict deployment certification',
              '',
              `- Result: **${status}**`,
              `- Commit: \`${clean(context.sha)}\``,
              `- Expected version: \`${clean(process.env.EXPECTED_APP_VERSION)}\``,
              `- Samples: **${Number(report.consecutive_passes || 0)} / ${Number(report.samples_configured || 0)}** consecutive passes`,
              `- Launch status: \`${clean(launch.status)}\``,
              `- Non-ready launch codes: ${codes.length ? codes.map(code => `\`${code}\``).join(', ') : 'none'}`,
              `- Reminder encryption preflight: \`${reminderStatus}\``,
              `- Reminder rows: total=${Number(reminder.total || 0)}, current=${Number(reminder.already_current || 0)}, legacy=${Number(reminder.decryptable_legacy_token || 0)}, unreadable=${Number(reminder.unreadable || 0)}`,
              `- Generated: \`${clean(report.generated_at)}\``,
              `- Workflow: ${runUrl}`,
              '',
              '> Sanitized certification summary only. No production URL, credentials, headers, response bodies, user data, reminder IDs, phone numbers, ciphertext, or document content are included.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CERTIFICATION_ISSUE),
              body,
            });

      - name: Reject unstable deployment
        if: steps.certification.outcome == 'failure' || steps.reminder_preflight.outcome == 'failure'
        run: exit 1
