name: Brief Scanner Runtime Executor

on:
  pull_request:
    paths:
      - "brief_scanner_runtime_*.py"
      - "hero_memory.py"
      - "tests/test_brief_scanner_runtime_*.py"
      - "tests/test_hero_memory.py"
      - ".github/workflows/brief-scanner-runtime-executor.yml"
  push:
    branches: [main]
    paths:
      - "brief_scanner_runtime_*.py"
      - "hero_memory.py"
      - "tests/test_brief_scanner_runtime_*.py"
      - "tests/test_hero_memory.py"
      - ".github/workflows/brief-scanner-runtime-executor.yml"

permissions:
  contents: read

jobs:
  runtime-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile Runtime Executor boundary
        run: >-
          python -m compileall -q
          brief_scanner_runtime_adapter.py
          brief_scanner_runtime_executor.py
          hero_memory.py
          tests/test_brief_scanner_runtime_adapter.py
          tests/test_brief_scanner_runtime_executor.py
          tests/test_hero_memory.py
      - name: Run Runtime Executor contracts
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_runtime_adapter.py
          tests/test_brief_scanner_runtime_executor.py
          tests/test_hero_memory.py
      - name: Re-run authorization and security contracts
        run: >-
          python -m pytest -q
          tests/test_brief_scanner_execution_boundary.py
          tests/test_brief_scanner_mission_engine.py
          tests/test_tenant_isolation.py
          tests/test_dependency_policy.py
          tests/test_secret_leak_guard.py
          tests/test_environment_contract.py
          tests/test_runtime_health.py
          tests/test_webhook_security.py
          tests/test_log_safety.py
