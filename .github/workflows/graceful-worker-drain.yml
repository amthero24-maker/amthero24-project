name: Graceful Worker Drain

on:
  pull_request:
    paths:
      - deployment_lifecycle.py
      - durable_queue_extensions.py
      - reminder_extensions.py
      - runtime_health.py
      - webhook_security.py
      - tests/test_deployment_lifecycle.py
      - tests/test_webhook_security.py
      - tests/test_runtime_health.py
      - tests/test_postgresql_durable_queue.py
      - .github/workflows/graceful-worker-drain.yml
  push:
    branches: [main]
    paths:
      - deployment_lifecycle.py
      - durable_queue_extensions.py
      - reminder_extensions.py
      - runtime_health.py
      - webhook_security.py
      - tests/test_deployment_lifecycle.py
      - tests/test_webhook_security.py
      - tests/test_runtime_health.py
      - tests/test_postgresql_durable_queue.py
      - .github/workflows/graceful-worker-drain.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile lifecycle composition
        run: python -m compileall -q deployment_lifecycle.py durable_queue_extensions.py reminder_extensions.py runtime_health.py webhook_security.py
      - name: Run lifecycle and admission regression tests
        run: python -m pytest -q tests/test_deployment_lifecycle.py tests/test_webhook_security.py tests/test_runtime_health.py
