name: Log Safety

on:
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-log-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Validate static logging privacy policy
        id: logging_policy
        continue-on-error: true
        run: python scripts/validate_logging_policy.py --json > logging-policy.json
      - name: Run runtime and static log safety tests
        id: logging_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=short --junitxml=log-safety-junit.xml \
            tests/test_log_safety.py tests/test_logging_policy.py 2>&1 | tee log-safety-tests.log
      - name: Upload sanitized log-safety diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-safety-report
          path: |
            logging-policy.json
            log-safety-junit.xml
            log-safety-tests.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce policy and test outcomes
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.logging_policy.outcome }}
          TEST_OUTCOME: ${{ steps.logging_tests.outcome }}
        run: |
          test "$POLICY_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
