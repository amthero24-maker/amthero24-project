name: Environment Contract

on:
  pull_request:
    paths:
      - ".env.example"
      - "**/*.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "**/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Validate documented runtime environment
        id: contract
        continue-on-error: true
        run: python scripts/validate_environment_contract.py --json > environment-contract.json
      - name: Upload sanitized contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-contract-report
          path: environment-contract.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run environment contract tests
        run: python -m pytest -q tests/test_environment_contract.py
      - name: Fail when configuration drift is detected
        if: steps.contract.outcome == 'failure'
        run: exit 1
