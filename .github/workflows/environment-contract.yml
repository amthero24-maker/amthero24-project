name: Environment Contract

on:
  pull_request:
    paths:
      - ".env.example"
      - "**/*.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "**/*.py"
      - ".github/workflows/**"
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Validate documented runtime environment
        id: contract
        continue-on-error: true
        run: python scripts/validate_environment_contract.py --json > environment-contract.json
      - name: Run environment contract tests
        id: contract_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=short --junitxml=environment-contract-junit.xml \
            tests/test_environment_contract.py 2>&1 | tee environment-contract-tests.log
      - name: Upload sanitized contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: environment-contract-report
          path: |
            environment-contract.json
            environment-contract-junit.xml
            environment-contract-tests.log
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce contract and test outcomes
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          TEST_OUTCOME: ${{ steps.contract_tests.outcome }}
        run: |
          test "$CONTRACT_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
