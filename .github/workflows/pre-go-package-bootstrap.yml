name: Pre-GO Package Bootstrap

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/workflows/pre-go-package-bootstrap.yml"
      - ".github/bootstrap-source/**"

permissions:
  contents: write

concurrency:
  group: pre-go-package-bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - name: Restore complete package from canonical source parts
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/bootstrap-source/part-07.txt
          cat .github/bootstrap-source/part-*.txt | base64 --decode > /tmp/pre-go-source.tar.gz
          tar -tzf /tmp/pre-go-source.tar.gz >/dev/null
          tar -xzf /tmp/pre-go-source.tar.gz -C .
          rm -rf .bootstrap .github/bootstrap-source
          rm -f .github/workflows/pre-go-package-bootstrap.yml
      - name: Run safe pre-GO source checks
        shell: bash
        run: |
          set -euo pipefail
          test -f website/package.json
          test -f website/package-lock.json
          cd website
          node scripts/validate-launch.mjs
          python3 -m py_compile scripts/generate-demo-assets.py
      - name: Commit complete package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize complete pre-go website and legal package"
          git push origin HEAD:feat/pre-go-launch-package-205
