name: Pre-GO Package Bootstrap

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/workflows/pre-go-package-bootstrap.yml"
      - ".github/bootstrap-source/**"

permissions:
  contents: write

concurrency:
  group: pre-go-package-bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - name: Restore complete package from canonical source parts
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/bootstrap-source/part-07.txt
          set +e
          cat .github/bootstrap-source/part-*.txt | base64 --decode > /tmp/pre-go-source.tar.gz
          decode_status=$?
          set -e
          if [ "$decode_status" -ne 0 ]; then
            echo "Decoder reported trailing source padding; validating the reconstructed gzip before continuing."
          fi
          tar -tzf /tmp/pre-go-source.tar.gz >/dev/null
          tar -xzf /tmp/pre-go-source.tar.gz -C .

          # GitHub Apps cannot create or modify Actions workflow files through a
          # workflow-triggered git push. Keep those two files out of this commit;
          # the connected GitHub app adds them explicitly after materialization.
          mkdir -p /tmp/pre-go-workflows
          for file in \
            .github/workflows/website-ci.yml \
            .github/workflows/website-assets-bootstrap.yml; do
            if [ -f "$file" ]; then
              mv "$file" /tmp/pre-go-workflows/
            fi
          done

          rm -rf .bootstrap .github/bootstrap-source
          # Keep this bootstrap workflow unchanged during the bot push. It is
          # removed later through the connected GitHub app.
      - name: Run safe pre-GO source checks
        shell: bash
        run: |
          set -euo pipefail
          test -f website/package.json
          test -f website/package-lock.json
          cd website
          node scripts/validate-launch.mjs
          node scripts/validate-content.mjs
          python3 -m py_compile scripts/generate-demo-assets.py
      - name: Commit website and launch documentation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A website .github/bootstrap-source .bootstrap
          git diff --cached --check
          git commit -m "feat: materialize complete pre-go website and legal package"
          git push origin HEAD:feat/pre-go-launch-package-205
