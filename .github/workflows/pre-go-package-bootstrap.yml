name: Pre-GO Package Bootstrap

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/workflows/pre-go-package-bootstrap.yml"
      - ".bootstrap/**"

permissions:
  contents: write

concurrency:
  group: pre-go-package-bootstrap-clean
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - name: Verify bootstrap archives
        shell: bash
        run: |
          set -euo pipefail
          echo "14631a561e939734a42f5d3f89f3544725c1bd4258772bdfdc565c61d8caaece  .bootstrap/pre-go-source-text.tgz" | sha256sum --check
          echo "e29e14888f24d08e733173ea3512f47f22e7edc716b8a63ad65af50edcf6fbfa  .bootstrap/pre-go-media.tgz" | sha256sum --check
          tar -tzf .bootstrap/pre-go-source-text.tgz >/dev/null
          tar -tzf .bootstrap/pre-go-media.tgz >/dev/null
      - name: Materialize website and pre-GO docs
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/pre-go-source-text.tgz -C .
          tar -xzf .bootstrap/pre-go-media.tgz -C .
          test -f website/package.json
          test -f website/public/assets/videos/brief-scanner.mp4
          test -f docs/pre-go/legal/01-IMPRESSUM-DE.md
      - name: Generate deterministic install lock
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f package-lock.json
      - name: Validate website source and fail-closed launch gates
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run release:check
          npm run legal:check
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit materialized package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A website docs/pre-go .bootstrap
          git diff --cached --check
          git commit -m "feat: materialize pre-go website and legal package"
          git push origin HEAD:feat/pre-go-launch-package-205
