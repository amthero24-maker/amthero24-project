name: Pre-GO Package Bootstrap

on:
  push:
    branches:
      - feat/pre-go-launch-package-205
    paths:
      - ".github/workflows/pre-go-package-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: pre-go-package-bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pre-go-launch-package-205
          fetch-depth: 0
      - name: Verify and unpack package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/pre-go-package/chunk-* | base64 --decode > /tmp/pre-go-package.tgz
          echo "222bfbeadb68a999dbb7aac083500dfc4069f4f104aa1236adaf65096f6381d7  /tmp/pre-go-package.tgz" | sha256sum --check
          tar -xzf /tmp/pre-go-package.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/pre-go-package-bootstrap.yml
      - name: Run safe pre-GO source checks
        shell: bash
        run: |
          set -euo pipefail
          cd website
          node scripts/validate-launch.mjs
          python3 -m py_compile scripts/generate-demo-assets.py
      - name: Commit complete package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AmtHero24 Launch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete pre-GO website and legal package"
          git push origin HEAD:feat/pre-go-launch-package-205
