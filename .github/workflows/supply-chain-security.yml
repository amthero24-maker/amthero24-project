name: Supply Chain Security

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "scripts/validate_dependency_policy.py"
      - "tests/test_dependency_policy.py"
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "scripts/validate_dependency_policy.py"
      - "tests/test_dependency_policy.py"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-security.txt
      - name: Validate dependency and workflow policy
        id: policy
        continue-on-error: true
        run: python scripts/validate_dependency_policy.py --json > dependency-policy.json
      - name: Install production and audit dependencies
        run: python -m pip install --quiet -r requirements-security.txt
      - name: Validate installed dependency compatibility
        id: pip_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip check 2>&1 | tee pip-check.txt
      - name: Audit production requirements for known vulnerabilities
        id: vulnerability_audit
        continue-on-error: true
        run: >-
          python -m pip_audit
          -r requirements.txt
          --format=json
          --output=pip-audit.json
          --progress-spinner=off
          --desc=on
          --timeout=30
      - name: Generate CycloneDX production SBOM
        id: sbom
        continue-on-error: true
        run: >-
          python -m pip_audit
          -r requirements.txt
          --format=cyclonedx-json
          --output=sbom.cdx.json
          --progress-spinner=off
          --timeout=30
      - name: Capture resolved audit environment
        if: always()
        run: python -m pip freeze --all > resolved-audit-environment.txt
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            dependency-policy.json
            pip-check.txt
            pip-audit.json
            sbom.cdx.json
            resolved-audit-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce supply-chain outcomes
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          PIP_CHECK_OUTCOME: ${{ steps.pip_check.outcome }}
          AUDIT_OUTCOME: ${{ steps.vulnerability_audit.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          test "$POLICY_OUTCOME" = "success"
          test "$PIP_CHECK_OUTCOME" = "success"
          test "$AUDIT_OUTCOME" = "success"
          test "$SBOM_OUTCOME" = "success"
