name: Cancellation Grounding

on:
  pull_request:
    paths:
      - "cancellation_contract.py"
      - "cancellation_draft_grounding.py"
      - "cancellation_grounding_extensions.py"
      - "draft_assistance.py"
      - "official_draft_delivery.py"
      - "official_draft_runtime_extension.py"
      - "webhook_security.py"
      - "tests/test_cancellation_contract.py"
      - "tests/test_cancellation_grounding_extensions.py"
      - "tests/test_official_draft_runtime_extension.py"
      - ".github/workflows/cancellation-grounding.yml"
  push:
    branches: [main]
    paths:
      - "cancellation_contract.py"
      - "cancellation_draft_grounding.py"
      - "cancellation_grounding_extensions.py"
      - "draft_assistance.py"
      - "official_draft_delivery.py"
      - "official_draft_runtime_extension.py"
      - "webhook_security.py"
      - "tests/test_cancellation_contract.py"
      - "tests/test_cancellation_grounding_extensions.py"
      - "tests/test_official_draft_runtime_extension.py"
      - ".github/workflows/cancellation-grounding.yml"

permissions:
  contents: read

concurrency:
  group: cancellation-grounding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install exact test dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Compile cancellation delivery boundaries
        run: >-
          python -m compileall -q
          cancellation_contract.py
          cancellation_draft_grounding.py
          cancellation_grounding_extensions.py
          draft_assistance.py
          official_draft_delivery.py
          official_draft_runtime_extension.py
          webhook_security.py
          tests/test_cancellation_contract.py
          tests/test_cancellation_grounding_extensions.py
          tests/test_official_draft_runtime_extension.py
      - name: Prove grounded cancellation drafts and copy-safe assistance
        run: >-
          python -m pytest -q
          tests/test_cancellation_contract.py
          tests/test_cancellation_grounding_extensions.py
          tests/test_official_draft_runtime_extension.py
