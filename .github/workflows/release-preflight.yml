name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact application version expected from production /health
        required: true
        type: string
      require_recent_backup:
        description: Require a recent backup manifest available to the runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      EXPECTED_APP_VERSION: ${{ inputs.expected_version }}
      RELEASE_REQUIRE_RECENT_BACKUP: ${{ inputs.require_recent_backup }}
      BACKUP_MANIFEST_PATH: ${{ vars.BACKUP_MANIFEST_PATH }}
      SMOKE_TIMEOUT_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Run strict production release gate
        run: python scripts/release_preflight.py --json
